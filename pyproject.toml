[project]
name = "clml"
version = "0.1.0"
description = "Classical machine learning playground built around scikit-learn pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "catboost>=1.2.8",
    "category-encoders>=2.6.4",
    "cvxpy>=1.6.0",
    "imbalanced-learn>=0.12.4",
    "interpret-core>=0.6.7",
    "joblib>=1.4.2",
    "lifelines>=0.30.0",
    "lightgbm>=4.5.0",
    "matplotlib>=3.9.2",
    "mlflow>=2.17.2",
    "ngboost>=0.5.1",
    "numpy>=2.0.2",
    "optuna>=4.0.0",
    "pandas>=2.2.3",
    "pydantic-settings>=2.6.1",
    "rich>=13.9.4",
    "river>=0.22.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.14.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "typer>=0.13.0",
    "umap-learn>=0.5.7",
    "xgboost>=2.1.2",
]

[project.scripts]
clml = "clml.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
